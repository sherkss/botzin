<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Botzin - Configuracoes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Botzin</h1>
          <p>Configuracoes de contas, chars, maquinas e hunts.</p>
        </div>
        <div class="topbar-actions">
          <span id="currentUser"></span>
          <button id="refreshButton" type="button">Atualizar</button>
          <button id="logoutButton" type="button">Sair</button>
        </div>
      </header>

      <section id="loginPanel" class="panel auth-panel">
        <form id="loginForm">
          <h2>Login</h2>
          <label>Usuario <input name="username" autocomplete="username" required /></label>
          <label>Senha <input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section id="configApp" class="grid">
        <form id="accountForm" class="panel">
          <h2>Conta</h2>
          <label>Nome <input name="name" required /></label>
          <label>Login <input name="loginIdentifier" required /></label>
          <label>Referencia secreta <input name="secretReference" placeholder="vault:tibia/main" /></label>
          <label>Notas <textarea name="notes"></textarea></label>
          <button type="submit">Salvar conta</button>
        </form>

        <form id="characterForm" class="panel">
          <h2>Char</h2>
          <label>Conta <select name="accountId" required></select></label>
          <label>Nome <input name="name" required /></label>
          <label>World <input name="world" /></label>
          <label>Vocacao <input name="vocation" /></label>
          <label>Level <input name="level" type="number" min="1" /></label>
          <button type="submit">Salvar char</button>
        </form>

        <form id="machineForm" class="panel">
          <h2>Maquina</h2>
          <label>Node ID <input name="nodeId" required placeholder="pc-main" /></label>
          <label>Nome <input name="name" required /></label>
          <label>Funcao
            <select name="role">
              <option value="perception">Percepcao</option>
              <option value="coordinator">Coordenador</option>
              <option value="raspberry-executor">Raspberry executor</option>
            </select>
          </label>
          <label>Host preferido <input name="preferredHost" placeholder="192.168.0.10" /></label>
          <label>Notas de conexao <textarea name="connectionNotes"></textarea></label>
          <button type="submit">Salvar maquina</button>
        </form>

        <form id="huntForm" class="panel">
          <h2>Hunt</h2>
          <label>Nome <input name="name" required /></label>
          <label>Cidade <input name="city" /></label>
          <label>Perfil de rota <input name="routeProfile" /></label>
          <label>Level minimo <input name="minLevel" type="number" min="1" /></label>
          <label>Notas <textarea name="notes"></textarea></label>
          <button type="submit">Salvar hunt</button>
        </form>

        <form id="skillForm" class="panel">
          <h2>Skill</h2>
          <label>Nome <input name="name" required placeholder="Exori" /></label>
          <label>Palavras <input name="spellWords" placeholder="exori" /></label>
          <label>Hotkey <input name="hotkey" placeholder="F1" /></label>
          <label>Categoria
            <select name="category">
              <option value="attack">Ataque</option>
              <option value="healing">Cura</option>
              <option value="support">Suporte</option>
              <option value="utility">Utilidade</option>
            </select>
          </label>
          <label>Custo de mana <input name="manaCost" type="number" min="0" value="0" /></label>
          <label>Level minimo <input name="requiredLevel" type="number" min="0" value="0" /></label>
          <label>Vocacoes permitidas <input name="allowedVocations" required placeholder="knight,elite knight" /></label>
          <label>Cooldown ms <input name="cooldownMs" type="number" min="0" value="1000" /></label>
          <label>Notas <textarea name="notes"></textarea></label>
          <button type="submit">Salvar skill</button>
        </form>

        <form id="assignmentForm" class="panel wide">
          <h2>Atribuicao de hunt</h2>
          <label>Maquina <select name="machineId" required></select></label>
          <label>Char <select name="characterId" required></select></label>
          <label>Hunt <select name="huntId" required></select></label>
          <label>Status
            <select name="status">
              <option value="planned">Planejada</option>
              <option value="active">Ativa</option>
              <option value="paused">Pausada</option>
              <option value="disabled">Desativada</option>
            </select>
          </label>
          <label>Prioridade <input name="priority" type="number" value="100" /></label>
          <label>Notas <textarea name="notes"></textarea></label>
          <button type="submit">Salvar atribuicao</button>
        </form>

        <form id="huntSkillRuleForm" class="panel wide">
          <h2>Regra de skill na hunt</h2>
          <label>Hunt <select name="huntId" required></select></label>
          <label>Skill <select name="skillId" required></select></label>
          <label>Prioridade <input name="priority" type="number" value="100" /></label>
          <label>Mana minima % <input name="minManaPercent" type="number" min="0" max="100" /></label>
          <label>Mana maxima % <input name="maxManaPercent" type="number" min="0" max="100" /></label>
          <label>HP minimo % <input name="minHpPercent" type="number" min="0" max="100" /></label>
          <label>HP maximo % <input name="maxHpPercent" type="number" min="0" max="100" /></label>
          <label>Criaturas minimas <input name="minCreatures" type="number" min="0" /></label>
          <label>Criaturas maximas <input name="maxCreatures" type="number" min="0" /></label>
          <label>Notas <textarea name="notes"></textarea></label>
          <button type="submit">Salvar regra</button>
        </form>

        <form id="learningMethodForm" class="panel wide">
          <h2>Metodo de aprendizado</h2>
          <label>Nome <input name="name" required placeholder="Demo manual EK hunt" /></label>
          <label>Tipo
            <select name="methodType">
              <option value="manual-rules">Regras manuais</option>
              <option value="human-demonstration">Demonstracao humana</option>
              <option value="replay">Replay de sessoes</option>
              <option value="human-feedback">Feedback humano</option>
              <option value="hunt-telemetry">Telemetria de hunt</option>
              <option value="external-knowledge">Conhecimento externo</option>
            </select>
          </label>
          <label>Escopo
            <select name="scope">
              <option value="global">Global</option>
              <option value="hunt">Hunt</option>
              <option value="character">Char</option>
              <option value="party">Party</option>
            </select>
          </label>
          <label>Hunt <select name="huntId"></select></label>
          <label>Char <select name="characterId"></select></label>
          <label>Peso <input name="weight" type="number" step="0.1" value="1" /></label>
          <label>Modo
            <select name="mode">
              <option value="observe">Observar</option>
              <option value="suggest">Sugerir</option>
              <option value="execute">Executar</option>
            </select>
          </label>
          <label>Config JSON <textarea name="configJson" placeholder='{"source":"obs","recordInputs":true}'></textarea></label>
          <label>Notas <textarea name="notes"></textarea></label>
          <button type="submit">Salvar metodo</button>
        </form>

        <form id="learningSessionForm" class="panel wide">
          <h2>Sessao de ensino</h2>
          <label>Metodo <select name="methodId" required></select></label>
          <label>Atribuicao <select name="assignmentId"></select></label>
          <label>Nome <input name="name" required placeholder="Treino hunt dragon 01" /></label>
          <label>Status
            <select name="status">
              <option value="recording">Gravando</option>
              <option value="reviewing">Revisando</option>
              <option value="approved">Aprovada</option>
              <option value="rejected">Rejeitada</option>
              <option value="archived">Arquivada</option>
            </select>
          </label>
          <label>Resumo JSON <textarea name="summaryJson" placeholder='{"xpHour":0,"profit":0}'></textarea></label>
          <label>Notas <textarea name="notes"></textarea></label>
          <button type="submit">Salvar sessao</button>
        </form>

        <form id="learningSourceForm" class="panel wide">
          <h2>Fonte de ensino</h2>
          <label>Nome <input name="name" required placeholder="Video hunt EK dragons" /></label>
          <label>Tipo
            <select name="sourceType">
              <option value="video">Video</option>
              <option value="image">Imagem/frame</option>
              <option value="text">Texto</option>
              <option value="web-page">Pagina web</option>
              <option value="market-snapshot">Snapshot market</option>
              <option value="obs-recording">Gravacao OBS</option>
              <option value="replay">Replay</option>
              <option value="telemetry">Telemetria</option>
              <option value="manual-note">Nota manual</option>
            </select>
          </label>
          <label>URI ou caminho <input name="uri" placeholder="C:\\videos\\hunt.mp4 ou https://..." /></label>
          <label>Hash <input name="contentHash" /></label>
          <label>Idioma <input name="language" placeholder="pt-BR" /></label>
          <label>Status
            <select name="status">
              <option value="pending">Pendente</option>
              <option value="processing">Processando</option>
              <option value="ready">Pronto</option>
              <option value="failed">Falhou</option>
              <option value="archived">Arquivado</option>
            </select>
          </label>
          <label>Confianca
            <select name="trustLevel">
              <option value="medium">Media</option>
              <option value="low">Baixa</option>
              <option value="high">Alta</option>
              <option value="verified">Verificada</option>
            </select>
          </label>
          <label>Capturado em <input name="capturedAt" type="datetime-local" /></label>
          <label>Metadata JSON <textarea name="metadataJson" placeholder='{"hunt":"dragons","source":"youtube"}'></textarea></label>
          <label>Notas <textarea name="notes"></textarea></label>
          <button type="submit">Salvar fonte</button>
        </form>

        <form id="videoUploadForm" class="panel wide" enctype="multipart/form-data">
          <h2>Adicionar video de hunt/quest</h2>
          <label>Nome <input name="name" required placeholder="Hunt EK dragons 2026-06-16" /></label>
          <label>Arquivo <input name="video" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-matroska,video/x-msvideo,.mp4,.mkv,.mov,.avi,.webm" required /></label>
          <label>Tipo
            <select name="sourceType">
              <option value="video">Video</option>
              <option value="obs-recording">Gravacao OBS</option>
            </select>
          </label>
          <label>Hunt <input name="hunt" placeholder="Dragon Lair" /></label>
          <label>Quest <input name="quest" placeholder="Nome da quest, se for quest" /></label>
          <label>Idioma <input name="language" value="pt-BR" /></label>
          <label>Confianca
            <select name="trustLevel">
              <option value="high">Alta</option>
              <option value="medium">Media</option>
              <option value="verified">Verificada</option>
              <option value="low">Baixa</option>
            </select>
          </label>
          <label>Capturado em <input name="capturedAt" type="datetime-local" /></label>
          <label>Notas <textarea name="notes"></textarea></label>
          <button type="submit">Enviar video</button>
        </form>

        <form id="learningMethodSourceForm" class="panel wide">
          <h2>Fonte usada por metodo</h2>
          <label>Metodo <select name="methodId" required></select></label>
          <label>Fonte <select name="sourceId" required></select></label>
          <label>Papel
            <select name="role">
              <option value="primary">Principal</option>
              <option value="validation">Validacao</option>
              <option value="reference">Referencia</option>
              <option value="negative-example">Exemplo negativo</option>
            </select>
          </label>
          <label>Peso <input name="weight" type="number" step="0.1" value="1" /></label>
          <button type="submit">Vincular fonte</button>
        </form>
      </section>

      <section class="panel">
        <h2>Configuracao atual</h2>
        <div id="status" class="status"></div>
        <div id="snapshot" class="snapshot"></div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
